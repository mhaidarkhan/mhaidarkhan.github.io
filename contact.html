<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Muhammad Haidar Khan</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body data-theme="light">
  <div id="pageOverlay" class="page-overlay" aria-hidden="true"></div>
  <button id="scrollTop" class="scroll-top" aria-label="Scroll to top">↑</button>
  <div class="cursor-highlight" id="cursorHighlight3" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html">Haidar</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <div class="header-right">
        <button id="themeToggle3" class="theme-toggle" aria-label="Toggle theme">☀️</button>
      </div>
    </div>
  </header>

  <main class="wrap contact-wrap">
    <h1>Contact</h1>
    <p class="lead">Tell me about your goals and timeline — I’ll respond personally.</p>

    <form id="contactForm" class="contact-form" action="https://formspree.io/f/xnnggvnq" method="POST">
      <label><span>Name</span><input name="name" required></label>
      <label><span>Email</span><input name="_replyto" type="email" required></label>
      <label><span>Company / Website</span><input name="company"></label>
      <label><span>Message</span><textarea name="message" rows="6" required></textarea></label>

      <div class="form-actions">
        <button class="btn-primary" type="submit">Send message</button>
        <a class="btn-ghost" href="mailto:mhkvlog@gmail.com">Email directly</a>
      </div>

      <input type="hidden" name="_subject" value="Portfolio contact">
      <input type="hidden" name="_captcha" value="false">
    </form>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>© <span id="yearC"></span> Muhammad Haidar Khan</div>
      <div>Marketing with heart & integrity.</div>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
